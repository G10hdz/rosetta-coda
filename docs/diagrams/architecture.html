<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rosetta Coda — architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      margin-bottom: 0.4rem;
    }
    .sub { color: var(--color-muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Rosetta Coda — falsifiable hypothesis pipeline</h1>
    <p class="sub">A research instrument, not a translator: every stage emits immutable, content-hashed artifacts; a preregistered gate must pass before interpretation.</p>

    <svg viewBox="0 0 1100 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rc-title rc-desc">
      <title id="rc-title">Rosetta Coda pipeline</title>
      <desc id="rc-desc">Metadata and optional WAV ingest to canonical records; cohort resolves identity; analysis normalizes timing z-scores; a preregistered statistical gate blocks interpretation until passed; phonology extracts deterministic features; an analyst adapter generates ranked falsifiable hypotheses; reporting assembles citable artifacts. All stages write content-addressed JSON to artifacts/.</desc>
      <defs>
        <marker id="rc-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="rc-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="1100" height="480" fill="#f5f5f5"/>

      <!-- inputs -->
      <rect x="40" y="100" width="170" height="60" rx="6" fill="rgba(79,93,117,0.06)" stroke="#7a8399" stroke-width="1"/>
      <text x="125" y="124" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">data/ metadata</text>
      <text x="125" y="142" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">loaders + validation</text>

      <rect x="40" y="180" width="170" height="60" rx="6" fill="rgba(79,93,117,0.06)" stroke="#7a8399" stroke-width="1"/>
      <text x="125" y="204" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">WAV (optional)</text>
      <text x="125" y="222" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">detector/ clicks</text>

      <!-- pipeline -->
      <rect x="260" y="60" width="180" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="350" y="82" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">contracts/</text>
      <text x="350" y="100" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Pydantic → JSON Schema</text>

      <rect x="260" y="140" width="180" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="350" y="162" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">cohort</text>
      <text x="350" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">identity resolved?</text>

      <rect x="260" y="220" width="180" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="350" y="242" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">analysis/ normalize</text>
      <text x="350" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">per-whale z-scores</text>

      <!-- gate -->
      <rect x="490" y="140" width="180" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="498" y="146" width="38" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="517" y="155" fill="rgba(235,108,54,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GATE</text>
      <text x="580" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">preregistered</text>
      <text x="580" y="198" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vs published results</text>

      <rect x="720" y="100" width="180" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="810" y="124" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">phonology/</text>
      <text x="810" y="142" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rhythm · tempo · rubato</text>

      <rect x="720" y="180" width="180" height="60" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="810" y="204" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">interpretation/</text>
      <text x="810" y="222" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">LLM hypotheses, falsifiable</text>

      <rect x="720" y="260" width="180" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="810" y="282" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">reporting/</text>
      <text x="810" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">report.json/.md + limits</text>

      <!-- artifacts -->
      <rect x="950" y="140" width="120" height="140" rx="6" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.32)" stroke-width="0.8"/>
      <text x="1010" y="166" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">artifacts/</text>
      <text x="1010" y="190" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gates/ demo/</text>
      <text x="1010" y="206" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">release/</text>
      <text x="1010" y="230" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">content-hash</text>
      <text x="1010" y="246" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">manifests</text>

      <!-- consumers -->
      <rect x="260" y="330" width="240" height="50" rx="6" fill="rgba(79,93,117,0.06)" stroke="#7a8399" stroke-width="1"/>
      <text x="380" y="350" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">api/ — FastAPI read-only</text>
      <text x="380" y="368" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">serves artifacts</text>
      <rect x="530" y="330" width="240" height="50" rx="6" fill="rgba(79,93,117,0.06)" stroke="#7a8399" stroke-width="1"/>
      <text x="650" y="350" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">demo/ + research/ (static)</text>
      <text x="650" y="368" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rosetta-coda.vercel.app</text>

      <!-- edges -->
      <path d="M 210 130 L 260 130" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rc-arrow)"/>
      <path d="M 210 210 L 260 210" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rc-arrow)"/>
      <path d="M 350 116 L 350 140" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rc-arrow)"/>
      <path d="M 350 196 L 350 220" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rc-arrow)"/>
      <path d="M 440 248 L 470 248 Q 480 248 480 238 L 480 210 Q 480 200 490 200 L 490 200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rc-arrow)"/>
      <path d="M 670 160 L 720 145" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#rc-arrow-accent)"/>
      <path d="M 810 160 L 810 180" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rc-arrow)"/>
      <path d="M 810 240 L 810 260" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rc-arrow)"/>
      <path d="M 900 288 L 950 260" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rc-arrow)"/>
      <path d="M 500 355 L 530 355" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rc-arrow)"/>
      <path d="M 720 320 L 730 330 L 730 340 L 760 340 L 760 355 L 770 355" fill="none" stroke="none"/>
      <path d="M 810 316 L 810 340 L 770 355" fill="none" stroke="none"/>
      <path d="M 950 320 L 720 340 L 720 352 L 770 352" fill="none" stroke="none"/>
      <path d="M 1000 280 L 1000 330 L 720 330 L 720 330" fill="none" stroke="none"/>
      <path d="M 950 260 L 960 300 L 960 330 L 720 330" fill="none" stroke="none"/>

      <!-- artifacts to consumers -->
      <path d="M 960 280 L 960 340 L 780 355" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#rc-arrow)"/>
      <path d="M 960 340 L 500 355" fill="none" stroke="none"/>
      <path d="M 960 340 L 640 352 L 640 355 L 770 352" fill="none" stroke="none"/>

      <!-- footer -->
      <rect x="40" y="400" width="1020" height="52" rx="6" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.32)" stroke-width="0.8"/>
      <text x="550" y="422" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">No semantic ground truth — every artifact reproducible from immutable inputs + versioned code + model IDs</text>
      <text x="550" y="442" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">specs/ accepted contracts · uv sync --all-extras · pytest (unit+golden+fixture)</text>
    </svg>
  </div>
</body>
</html>
