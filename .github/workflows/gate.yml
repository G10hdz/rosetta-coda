name: gate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"

      - name: Fetch pinned corpus
        run: |
          mkdir -p external/sw-combinatoriality/data external/phonology-osf-9t6qu
          curl -fsSL -o external/sw-combinatoriality/data/DominicaCodas.csv \
            https://raw.githubusercontent.com/pratyushasharma/sw-combinatoriality/7228c8eed2cc27ddd23b74c51aeccec9d762389e/data/DominicaCodas.csv
          curl -fsSL -L -o external/phonology-osf-9t6qu/codamd.csv \
            https://osf.io/download/ytsq9/

      - name: Install
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest

      - name: Secretos (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --redact -v
